# LogLens CI: runs on pushes to main and on pull requests into main.

trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

variables:
  pesterVersion: '6.2.0'

steps:
- pwsh: |
    if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq '$(pesterVersion)')) {
      Install-Module Pester -RequiredVersion '$(pesterVersion)' -Scope CurrentUser -Force -SkipPublisherCheck
    }
    Import-Module Pester -RequiredVersion '$(pesterVersion)'

    $config = New-PesterConfiguration
    $config.Run.Path = 'tests/hooks'
    $config.Run.Exit = $true
    $config.Output.Verbosity = 'Detailed'
    $config.TestResult.Enabled = $true
    $config.TestResult.OutputFormat = 'NUnitXml'
    $config.TestResult.OutputPath = '$(Common.TestResultsDirectory)/hook-tests.xml'
    Invoke-Pester -Configuration $config
  displayName: 'Hook tests (Pester)'

- task: PublishTestResults@2
  displayName: 'Publish hook test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: NUnit
    testResultsFiles: '$(Common.TestResultsDirectory)/hook-tests.xml'
    testRunTitle: 'Hook tests'
