# LogLens CI: runs on pushes to main and on pull requests into main.

trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

variables:
  pesterVersion: '6.2.0'

steps:
- pwsh: |
    if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq '$(pesterVersion)')) {
      Install-Module Pester -RequiredVersion '$(pesterVersion)' -Scope CurrentUser -Force -SkipPublisherCheck
    }
    Import-Module Pester -RequiredVersion '$(pesterVersion)'

    $config = New-PesterConfiguration
    $config.Run.Path = 'tests/hooks'
    $config.Run.Exit = $true
    $config.Output.Verbosity = 'Detailed'
    $config.TestResult.Enabled = $true
    $config.TestResult.OutputFormat = 'NUnitXml'
    $config.TestResult.OutputPath = '$(Common.TestResultsDirectory)/hook-tests.xml'
    Invoke-Pester -Configuration $config
  displayName: 'Hook tests (Pester)'

- task: PublishTestResults@2
  displayName: 'Publish hook test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: NUnit
    testResultsFiles: '$(Common.TestResultsDirectory)/hook-tests.xml'
    testRunTitle: 'Hook tests'

# succeededOrFailed(): run the .NET tests even if the hook tests failed,
# so one run reports both suites.
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  condition: succeededOrFailed()
  inputs:
    packageType: sdk
    version: '10.0.x'

- script: dotnet test LogLens.slnx --configuration Release --logger trx --results-directory '$(Common.TestResultsDirectory)/dotnet'
  displayName: '.NET tests (xUnit)'
  condition: succeededOrFailed()

- task: PublishTestResults@2
  displayName: 'Publish .NET test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Common.TestResultsDirectory)/dotnet/*.trx'
    testRunTitle: '.NET tests'
